# Environment for the logD regression project (RDKit descriptors + linear models).
#
#   conda env create -f env.yml
#   conda activate logd_env
#
# Notes:
#   * This file matches the existing conda envs on this machine (Python 3.13, clean).
#     The workspace is bound to the "trial" env via .vscode/settings.json
#     (C:\Users\lhm\anaconda3\envs\trial\python.exe), so scripts run there by default.
#   * Packages are installed with pip because PyPI wheels are verified to exist
#     for cp313-win_amd64 (rdkit, scikit-learn, pyarrow, ...).
#   * For a pure-conda install, change python to 3.12 and move the packages from
#     the pip: section into dependencies: (rdkit is officially built on conda-forge).
#   * Anaconda is not on PATH and PowerShell runs with the Restricted execution
#     policy, so `conda activate trial` cannot work in a fresh shell. New terminals
#     in this workspace therefore skip auto-activation
#     (python.terminal.activateEnvironment = false) and put the trial env first on
#     PATH instead (terminal.integrated.env.windows), so `python` and `pip` already
#     point at trial. To get a real `(trial)` prompt instead, run once:
#       Set-ExecutionPolicy -Scope CurrentUser RemoteSigned
#       conda init powershell
name: logd_env
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      # ---- numerics / data ----
      - numpy>=2.1,<3
      - pandas>=2.2
      - scipy>=1.12
      # ---- cheminformatics ----
      - rdkit>=2024.3
      # ---- modelling ----
      - scikit-learn>=1.5
      - joblib>=1.3
      # ---- output / config ----
      - matplotlib>=3.8
      - pyyaml>=6.0
      - pyarrow>=15.0
      # ---- recommended ----
      - tqdm>=4.66
      # ---- optional, uncomment if needed ----
      # - seaborn>=0.13
      # - jupyterlab>=4
      # - shap>=0.44
      # - pytest>=8
